version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # minor/patch only by default; majors need manual review anyway
    open-pull-requests-limit: 5
    ignore:
      # Next pins its own React/ESLint/TS versions — let Next releases drive these
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: eslint
      - dependency-name: typescript
      - dependency-name: eslint-config-next
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
